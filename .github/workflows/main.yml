name: Scrape and Upload Matchs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scn-matchs-scraper
  cancel-in-progress: true

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scrape.js

      - name: Prepare FTP payload
        run: |
          mkdir -p deploy
          cp matchs.json deploy/matchs.json

      - name: Upload matchs.json to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: './deploy/'
          server-dir: '/www/Scrap-fff/'
          dangerous-clean-slate: false

      - name: Upload diagnostic when scraping fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fff-scrape-diagnostic
          path: |
            scrape-debug.html
            scrape-debug.png
          if-no-files-found: ignore
          retention-days: 7
